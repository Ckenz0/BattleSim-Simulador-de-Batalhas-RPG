name: battlesim
services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      service-a:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
  service-a:
    build:
      context: .
      dockerfile: service-a/Dockerfile
    environment:
      DATABASE_PATH: /data/battlesim.db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-battlesim}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}@rabbitmq:5672/
    volumes:
      - api-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  service-b:
    build:
      context: .
      dockerfile: service-b/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-battlesim}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}@rabbitmq:5672/
      WORKER_CPU_ITERATIONS: ${WORKER_CPU_ITERATIONS:-0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    stop_grace_period: 35s
  rabbitmq:
    image: rabbitmq:4.2-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-battlesim}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
networks:
  edge:
  internal:
    internal: true
volumes:
  api-data:
  rabbitmq-data:
