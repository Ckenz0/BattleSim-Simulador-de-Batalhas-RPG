apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Official F5 NGINX OSS manifests, pinned for repeatable local setup.
resources:
  - service.yaml
  - https://raw.githubusercontent.com/nginx/kubernetes-ingress/v5.7.1/deployments/common/ns-and-sa.yaml
  - https://raw.githubusercontent.com/nginx/kubernetes-ingress/v5.7.1/deployments/rbac/rbac.yaml
  - https://raw.githubusercontent.com/nginx/kubernetes-ingress/v5.7.1/deployments/common/nginx-config.yaml
  - https://raw.githubusercontent.com/nginx/kubernetes-ingress/v5.7.1/deployments/common/ingress-class.yaml
  - https://raw.githubusercontent.com/nginx/kubernetes-ingress/v5.7.1/deployments/deployment/nginx-ingress.yaml
patches:
  - target:
      kind: Deployment
      name: nginx-ingress
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -enable-custom-resources=false
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: "1"
          memory: 512Mi
