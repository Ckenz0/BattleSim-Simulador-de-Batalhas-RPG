apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: battlesim
    patch: |-
      # NGINX requires an explicit host; use localhost with the loopback forward.
      - op: replace
        path: /spec/rules/0/host
        value: localhost
