apiVersion: v1
kind: ServiceAccount
metadata:
  name: battlesim-observer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: battlesim-observer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [service-b]
    verbs: [get]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [service-b]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: battlesim-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: battlesim-observer
subjects:
  - kind: ServiceAccount
    name: battlesim-observer
    namespace: battlesim
