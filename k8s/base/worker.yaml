apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  # Omit replicas: re-applying must not overwrite the HPA's chosen size.
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: battlesim-worker
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: battlesim-config
          env:
            - name: WORKER_CONCURRENCY
              value: "1"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: battlesim-rabbitmq
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: battlesim-rabbitmq
                  key: password
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          # No HTTP server or heartbeat contract exists. Kubernetes restarts an
          # exited process; worker_ready/retry logs and queue consumers diagnose
          # broker connectivity. A PID check would not detect a stuck consumer.
