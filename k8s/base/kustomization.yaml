apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: battlesim
resources:
  - namespace.yaml
  - api.yaml
  - worker.yaml
  - rabbitmq.yaml
  - frontend.yaml
  - worker-hpa.yaml
configMapGenerator:
  - name: battlesim-config
    literals:
      - DATABASE_PATH=/data/battlesim.db
      - WORKER_CPU_ITERATIONS=0
images:
  - name: battlesim-api
    newTag: local
  - name: battlesim-worker
    newTag: local
  - name: battlesim-frontend
    newTag: local
