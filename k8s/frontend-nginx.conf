events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    map $http_x_request_id $correlation_id {
        "~^[a-zA-Z0-9._:-]{1,128}$" $http_x_request_id;
        default $request_id;
    }
    log_format trace escape=json '{"timestamp":"$time_iso8601","service":"frontend","request_id":"$correlation_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
    access_log /dev/stdout trace;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    # Kubernetes Service DNS resolves to the stable ClusterIP. Docker Compose's
    # 127.0.0.11 resolver does not exist in Kubernetes. Restart this Deployment
    # if service-a Service is deleted/recreated with a different ClusterIP.
    upstream api_backend { server service-a:8000; }
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 64k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location = /api/docs {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
